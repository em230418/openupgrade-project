version: '3.4'

x-default:
  &default-odoo
  tty: true
  volumes:
    - odoo-web-data:/var/lib/odoo
    - ./config:/etc/odoo
    - ./ou14:/opt/ou14
    - ./ou15:/opt/ou15
    - ./ou16:/opt/ou16
    - ./vendor:/opt/vendor
  ports:
    - 127.0.0.1:9999:8069

services:
  odoo14:
    << : *default-odoo
    build:
      context: ./context
      dockerfile: ./14.0_Dockerfile
    depends_on:
      - db
    command: [
    '-d', 'migbluesky',
    ]

  odoo15:
    << : *default-odoo
    build:
      context: ./context
      dockerfile: ./15.0_Dockerfile
    depends_on:
      - db
    command: [
    '-d', 'migbluesky',
    ]

  odoo16:
    << : *default-odoo
    build:
      context: ./context
      dockerfile: ./16.0_Dockerfile
    depends_on:
      - db
    command: [
    '-d', 'migbluesky',
    ]

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    command: ['postgres',
    '-c', 'fsync=off',
    '-c', 'synchronous_commit=off',
    '-c', 'full_page_writes=off',
    ]

volumes:
  odoo-web-data:
  odoo-db-data:
